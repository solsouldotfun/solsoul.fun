[package]
name = "soul-generator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[features]
default = []
# Opt-in feature that extends authenticated CPI authority checks for
# Soul provenance writes and receipt settlement to also trust the
# `LOCAL_INTEGRATION_BONDING_CURVE_PROGRAM_ID`. This is intended ONLY for
# local integration tests / `solana-program-test` scenarios that exercise
# the workspace's bonding-curve crate (which declares the legacy local
# integration program id). Default and devnet-deployed production-like
# builds MUST NOT enable this feature; they must trust only the
# canonical configured `BONDING_CURVE_PROGRAM_ID`. See SEC.A5 / SEC.F5.
integration = []

[dependencies]
pinocchio = { workspace = true, features = ["cpi"] }
pinocchio-pubkey = { workspace = true }
pinocchio-system = "0.6.0"
shared = { workspace = true }
libm = "0.2"

[dev-dependencies]
base64 = "0.22"
serde_json = "1"
solana-program-option = "2.2.1"
solana-program-pack = "2.2.1"
solana-address = { version = "2.6.0", features = ["curve25519"] }
solana-program-test = "2.3.11"
solana-sdk = "2.3.1"
spl-token-metadata-interface = "0.7"
spl-token-2022 = "8"
tokio = { version = "1", features = ["macros"] }
